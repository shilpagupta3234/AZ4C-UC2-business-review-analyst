<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Approval queue - Saffron Trail Foods</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #16213e;
  --ink-soft: #24315a;
  --saffron: #f4a300;
  --saffron-deep: #d48c00;
  --leaf: #1d7a4c;
  --rust: #b3401e;
  --slate: #5b6478;
  --line: #e1e5ec;
  --canvas: #f2f4f8;
  --paper: #ffffff;
  --text: #1b2233;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--canvas); color: var(--text); font: 400 16px/1.55 var(--body); }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 28px; }

/* Header */
.band { background: var(--ink); color: #f3f5fb; padding-bottom: 56px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 600; text-decoration: none; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #ffd27a, var(--saffron) 55%, var(--saffron-deep));
}
.brand small { display: block; font-weight: 400; color: #aeb8d4; font-size: 13px; line-height: 1.2; }
.title { display: flex; align-items: end; justify-content: space-between; gap: 24px; padding-top: 18px; }
.title h1 { font: 700 34px/1.1 var(--display); letter-spacing: -0.015em; margin: 0 0 6px; }
.title p { margin: 0; color: #c3cbe0; max-width: 62ch; }
.tally { display: flex; gap: 10px; flex-shrink: 0; }
.tally div { padding: 10px 16px; border-radius: 12px; background: var(--ink-soft); min-width: 116px; }
.tally b { display: block; font: 700 26px/1.1 var(--display); }
.tally span { color: #aeb8d4; font-size: 13px; }
.tally .waiting b { color: var(--saffron); }

/* Layout */
.page { display: grid; grid-template-columns: 300px 1fr; gap: 24px; margin-top: -36px; padding-bottom: 64px; }
.flash {
  grid-column: 1 / -1; margin: 0; padding: 14px 18px; border-radius: 12px; background: var(--paper);
  border: 1px solid var(--line); border-left: 5px solid var(--leaf); font-weight: 500;
}
.flash.warn { border-left-color: var(--rust); }
.flash.info { border-left-color: var(--saffron); }

/* Ask a question */
.side { display: grid; gap: 16px; align-self: start; }
.ask { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; align-self: start; }
.ask label { color: var(--slate); font-size: 13px; line-height: 1.45; margin-bottom: 10px; }
.ask label b { display: block; color: var(--text); font: 600 17px/1.3 var(--display); margin-bottom: 4px; }
.ask textarea { min-height: 88px; margin-bottom: 12px; }
.ask button { width: 100%; }
.ask small { display: block; text-align: center; color: var(--slate); margin-top: 8px; font-size: 13px; }

/* Queue */
.queue { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 18px; }
.queue h2 { font: 600 14px/1.3 var(--body); color: var(--slate); margin: 0 0 12px; }
.queue ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.queue a { display: block; padding: 12px 14px; border-radius: 12px; text-decoration: none; border: 1px solid var(--line); font-weight: 500; line-height: 1.4; }
.queue a:hover { background: var(--canvas); }
.queue a[aria-current="page"] { border: 2px solid var(--saffron); padding: 11px 13px; background: #fff8e8; }

/* Answer sheet */
.sheet { background: var(--paper); border-radius: 20px; padding: 32px 36px; border: 1px solid var(--line); }
.sheet-head { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; }
.sheet h2 { font: 700 clamp(24px, 2.6vw, 30px)/1.2 var(--display); letter-spacing: -0.01em; margin: 6px 0 0; max-width: 30ch; }
.stamp {
  width: 112px; height: 112px; border-radius: 50%; display: grid; place-content: center; text-align: center;
  color: var(--leaf); border: 3px solid currentColor; box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 6px currentColor;
  transform: rotate(-9deg); font: 700 19px/1.05 var(--display);
}
.stamp small { display: block; font: 500 12px/1.3 var(--body); margin-top: 4px; }
.stamp.failed { color: var(--rust); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); margin: 26px 0; border: 1px solid var(--line); border-radius: 14px; }
.facts div { padding: 14px 18px; }
.facts div + div { border-left: 1px solid var(--line); }
.facts dt { color: var(--slate); font-size: 13px; }
.facts dd { margin: 2px 0 0; font: 600 20px/1.3 var(--display); font-variant-numeric: tabular-nums; }
.lead { font: 600 20px/1.45 var(--display); margin: 0 0 10px; max-width: 60ch; }
.answer { font-size: 16px; line-height: 1.7; max-width: 74ch; margin: 0; color: #2c3448; }
.sheet h3 { font: 600 18px/1.3 var(--display); margin: 30px 0 8px; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--slate); font-weight: 500; font-size: 14px; }
td.num, th.num { text-align: right; padding-left: 16px; white-space: nowrap; font-weight: 500; }
td.neg { color: var(--rust); }
details { border-bottom: 1px solid var(--line); padding: 14px 0; }
details:first-of-type { margin-top: 24px; border-top: 1px solid var(--line); }
summary { cursor: pointer; font-weight: 600; }
details[open] summary { margin-bottom: 10px; }
pre { margin: 0 0 10px; padding: 12px 14px; border-radius: 10px; background: var(--canvas); overflow-x: auto; font: 13px/1.5 var(--mono); }
.cites { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.cites li { font-size: 14px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 8px; }

/* Sign-off */
.signoff { margin-top: 30px; padding: 24px 26px; border-radius: 16px; background: var(--canvas); }
.signoff h3 { margin-top: 0; }
.signoff p { margin: 0 0 16px; color: var(--slate); max-width: 64ch; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
label { display: block; font-size: 14px; color: var(--slate); margin-bottom: 6px; }
input[type="text"], textarea {
  width: 100%; font: inherit; color: var(--text); background: var(--paper);
  border: 1px solid #cfd5df; border-radius: 10px; padding: 10px 12px;
}
textarea { min-height: 72px; resize: vertical; }
.approver { max-width: 280px; margin-bottom: 16px; }
button {
  font: 600 16px/1 var(--body); border-radius: 999px; padding: 13px 24px; cursor: pointer;
  border: 2px solid var(--ink); background: var(--paper); color: var(--ink);
}
button.approve { background: var(--saffron); border-color: var(--saffron); color: #1b1300; }
button.approve:hover { background: var(--saffron-deep); border-color: var(--saffron-deep); }
button.reject { border-color: var(--rust); color: var(--rust); }
.change { margin-top: 20px; padding-top: 18px; border-top: 1px solid #d9dee7; }
.change .row > div { flex: 1 1 320px; }

/* Empty state */
.empty { background: var(--paper); border-radius: 20px; padding: 40px; border: 1px solid var(--line); }
.empty h2 { font: 700 26px/1.2 var(--display); margin: 0 0 10px; }
.empty p { margin: 0 0 14px; max-width: 60ch; color: var(--slate); }

@media (max-width: 900px) {
  .wrap { padding: 0 16px; }
  .title { flex-direction: column; align-items: start; }
  .page { grid-template-columns: 1fr; }
  .sheet { padding: 24px 20px; }
  .sheet-head { grid-template-columns: 1fr; }
  .stamp { width: 96px; height: 96px; font-size: 16px; }
  .facts { grid-template-columns: 1fr; }
  .facts div + div { border-left: 0; border-top: 1px solid var(--line); }
}
@media (prefers-reduced-motion: no-preference) {
  .stamp { animation: press 420ms cubic-bezier(.2, 1.4, .4, 1) both; }
  @keyframes press { from { transform: rotate(-9deg) scale(1.35); opacity: 0; } to { transform: rotate(-9deg) scale(1); opacity: 1; } }
}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>
        <span>Saffron Trail Foods<small>Finance review</small></span></a>
    </div>
    <div class="title">
      <div>
        <h1>Approval queue</h1>
        <p>Each answer was worked out from the sales tables and checked by a second calculation. Nothing reaches the leadership report until you approve it.</p>
      </div>
      <div class="tally">
        <div class="waiting"><b>$waiting</b><span>waiting for you</span></div>
        <div><b>$filed</b><span>filed so far</span></div>
      </div>
    </div>
  </div>
</header>
<main class="page wrap">
$flash
$queue
$detail
</main>
</body>
</html>
